        <a href="tel:+213790582551" class="btn-call">

        <button type="button" onclick="downloadVCard()" class="btn-save-contact" data-ar="📱 حفظ رقم الورشة" data-fr="📱 Enregistrer le numéro">📱 حفظ رقم الورشة</button>
        <button type="button" onclick="sharePage()" class="btn-share" data-ar="📤 مشاركة رابط الورشة مع صديق" data-fr="📤 Partager le garage avec un ami">📤 مشاركة رابط الورشة مع صديق</button>
        <a href="gallery-reviews.html" class="btn-save-contact" style="background:#0284c7; text-align:center; text-decoration:none;" data-ar="⭐ معرض الصور وآراء الزبائن" data-fr="⭐ Galerie & Avis">⭐ معرض الصور وآراء الزبائن</a>
        <div id="contact-message"></div>
    </div>

    <!-- نموذج الحجز -->
    <div class="section-title" data-ar="طلب حجز موعد" data-fr="Demande de rendez-vous">طلب حجز موعد</div>
    <div class="booking-form">
        <div class="form-group">
            <label data-ar="الاسم الكريم: *" data-fr="Votre nom: *">الاسم الكريم: <span class="required">*</span></label>
            <input type="text" id="client-name" class="form-control" data-ar="أدخل اسمك" data-fr="Entrez votre nom" placeholder="أدخل اسمك">
        </div>
        <div class="form-group">
            <label data-ar="نوع السيارة والمحرك:" data-fr="Type de voiture:">نوع السيارة والمحرك:</label>
            <input type="text" id="car-model" class="form-control" placeholder="Ex: Skoda Octavia 1.4 TSI">
        </div>
        <div class="form-group">
            <label data-ar="رقم الهاتف:" data-fr="Téléphone:">رقم الهاتف:</label>
            <input type="tel" id="client-phone" class="form-control phone-input" placeholder="05 XX XX XX XX">
        </div>
        <div class="form-group">
            <label data-ar="تاريخ الموعد المرغوب:" data-fr="Date souhaitée:">تاريخ الموعد المرغوب:</label>

        <!-- ✅ الخدمات كـ Checkboxes -->
        <div class="form-group">
            <label data-ar="الخدمات المطلوبة (يمكن اختيار أكثر من واحدة):" data-fr="Services souhaités (plusieurs possibles):">الخدمات المطلوبة (يمكن اختيار أكثر من واحدة):</label>
            <div class="services-checkboxes" id="bookingServices">
                <label class="service-checkbox">
                    <input type="checkbox" name="bookingService" value="Vidange + Filtres">
                    <span data-ar="🛢️ تغيير الزيت" data-fr="🛢️ Vidange">🛢️ تغيير الزيت</span>
                </label>
                <label class="service-checkbox">
                    <input type="checkbox" name="bookingService" value="Freinage">
                    <span data-ar="🛠️ الفرامل" data-fr="🛠️ Freinage">🛠️ الفرامل</span>
                </label>
                <label class="service-checkbox">
                    <input type="checkbox" name="bookingService" value="Suspension">
                    <span data-ar="🚗 التعليق" data-fr="🚗 Suspension">🚗 التعليق</span>
                </label>
                <label class="service-checkbox">
                    <input type="checkbox" name="bookingService" value="Embrayage">
                    <span data-ar="⚙️ الفبرياج" data-fr="⚙️ Embrayage">⚙️ الفبرياج</span>
                </label>
                <label class="service-checkbox">
                    <input type="checkbox" name="bookingService" value="Kit Distribution">
                    <span data-ar="🔄 كيت التوزيع" data-fr="🔄 Kit Distri.">🔄 كيت التوزيع</span>
                </label>
                <label class="service-checkbox">
                    <input type="checkbox" name="bookingService" value="Scanner & Diagnostic">
                    <span data-ar="💻 الفحص الإلكتروني" data-fr="💻 Diagnostic">💻 الفحص الإلكتروني</span>
                </label>
                <label class="service-checkbox">
                    <input type="checkbox" name="bookingService" value="Révision Moteur">
                    <span data-ar="🔧 عمرة المحرك" data-fr="🔧 Révision">🔧 عمرة المحرك</span>
                </label>
                <label class="service-checkbox">
                    <input type="checkbox" name="bookingService" value="Climatisation">
                    <span data-ar="❄️ المكيف" data-fr="❄️ Climatisation">❄️ المكيف</span>
                </label>
                <label class="service-checkbox">
                    <input type="checkbox" name="bookingService" value="Électricité Auto">
                    <span data-ar="⚡ الكهرباء" data-fr="⚡ Électricité">⚡ الكهرباء</span>
                </label>
                <label class="service-checkbox">
                    <input type="checkbox" name="bookingService" value="Autre">
                    <span data-ar="📝 عطل آخر" data-fr="📝 Autre">📝 عطل آخر</span>

        <div class="form-group">
            <label data-ar="وصف المشكل:" data-fr="Description:">وصف المشكل:</label>
            <textarea id="issue-desc" class="form-control" data-ar="اكتب هنا..." data-fr="Écrivez ici..." placeholder="اكتب هنا..."></textarea>
        </div>
        <button type="button" id="submitBookingBtn" onclick="sendBooking()" class="btn-submit-booking" data-ar="📲 إرسال الطلب عبر الواتساب" data-fr="📲 Envoyer via WhatsApp">📲 إرسال الطلب عبر الواتساب</button>
    </div>

    <!-- Footer -->
    <div class="footer">
        <strong>MED GARAGE</strong> © 2027<br>
        <span data-ar="جميع الحقوق محفوظة" data-fr="Tous droits réservés">جميع الحقوق محفوظة</span>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // ============ تبديل اللغة ============
    let currentLang = 'ar';
    function setLang(lang) {
        currentLang = lang;
        const html = document.getElementById('htmlRoot');
        if (lang === 'ar') {
            html.setAttribute('lang', 'ar');
            html.setAttribute('dir', 'rtl');
            document.getElementById('btnAr').classList.add('active');
            document.getElementById('btnFr').classList.remove('active');
        } else {
            html.setAttribute('lang', 'fr');
            html.setAttribute('dir', 'ltr');
            document.getElementById('btnFr').classList.add('active');
            document.getElementById('btnAr').classList.remove('active');
        }
        document.querySelectorAll('[data-ar][data-fr]').forEach(el => {
            const val = el.getAttribute('data-' + lang);
            if (val) {
                if (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') {
                    if (el.placeholder) el.placeholder = val;
                } else {
                    el.textContent = val;
                }
            }
        });
        try { localStorage.setItem('medgarage_lang', lang); } catch(e) {}
    }

    // ============ تبديل الثيم (+ theme-color ديناميكي) ============
    function setTheme(themeName) {
        const html = document.getElementById('htmlRoot');
        const meta = document.getElementById('themeColorMeta');
        if (themeName === 'light') {
            html.setAttribute('data-theme', 'light');
            if (meta) meta.setAttribute('content', '#f1f5f9');
        } else if (themeName === 'oled') {
            html.setAttribute('data-theme', 'oled');
            if (meta) meta.setAttribute('content', '#000000');
        } else {
            html.removeAttribute('data-theme');
            if (meta) meta.setAttribute('content', '#1a1d21');
        }
        try { localStorage.setItem('medgarage_theme', themeName); } catch(e) {}
    }

    // ============ تحميل التفضيلات ============
    try {
        const savedLang = localStorage.getItem('medgarage_lang');
        if (savedLang && savedLang !== 'ar') setLang(savedLang);
        const savedTheme = localStorage.getItem('medgarage_theme');
        if (savedTheme) setTheme(savedTheme);
    } catch(e) {}

    // ============ Toast ============
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show' + (type === 'error' ? ' error' : '');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ============ PWA Install ============
    let deferredPrompt;
    const installContainer = document.getElementById('installContainer');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installContainer) installContainer.classList.add('visible');
    });

    function promptInstall() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
                if (installContainer) installContainer.classList.remove('visible');
            });
        } else {
            showToast(currentLang === 'ar' ? '💡 اضغط على ⋮ ثم اختر "إضافة إلى الشاشة الرئيسية"' : '💡 Appuyez sur ⋮ puis "Ajouter à l\'écran d\'accueil"', 'error');
        }
    }

    // ============ VCard ============
    function downloadVCard() {
        const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:MED GARAGE\nORG:MED GARAGE Auto Repair\nTEL;TYPE=CELL,VOICE:+213790582551\nADR;TYPE=WORK:;;Cite 1780 OPGI;Souidania;Alger;16000;Algeria\nURL:https://wa.me/213790582551\nEND:VCARD";
        try {
            const encoded = encodeURIComponent(vcard);
            const dataUri = "data:text/vcard;charset=utf-8," + encoded;
            const link = document.createElement("a");
            link.href = dataUri;
            link.download = "MED_GARAGE.vcf";
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            setTimeout(() => document.body.removeChild(link), 100);

            const message = document.getElementById("contact-message");
            message.innerHTML = currentLang === 'ar' ? "✅ تم تحميل الملف! افتحه من <strong>الإشعارات</strong> أو <strong>التحميلات</strong>." : "✅ Fichier téléchargé ! Ouvrez-le depuis <strong>Notifications</strong> ou <strong>Téléchargements</strong>.";
            message.style.display = "block";
            showToast(currentLang === 'ar' ? '✅ تم تحميل بطاقة الاتصال' : '✅ Carte de contact téléchargée');
            setTimeout(() => message.style.display = "none", 8000);
        } catch (e) {
            showToast('⚠️ خطأ في التحميل', 'error');
        }
    }

    // ============ مشاركة ============
    function sharePage() {
        const shareData = {
            title: 'MED GARAGE - ورشة محمد لصيانة السيارات',
            text: currentLang === 'ar' ? '🚗 أنصحك بزيارة ورشة محمد لصيانة السيارات (السويدانية). تشخيص دقيق، خدمة احترافية، وأسعار معقولة:' : '🚗 Je vous recommande Garage Mohamed Auto Repair (Souidania) :',
            url: window.location.href
        };
        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            navigator.clipboard.writeText(window.location.href);
            showToast(currentLang === 'ar' ? '📋 تم نسخ رابط الورشة، يمكنك إرساله لأصدقائك!' : '📋 Lien copié, partagez-le avec vos amis !');
        }
    }

    // ============ إرسال الحجز (يُحفظ + يُفتح واتساب) ============
    function sendBooking() {
        const name = document.getElementById('client-name').value.trim();
        const car = document.getElementById('car-model').value.trim();
        const phone = document.getElementById('client-phone').value.trim();
        const bDate = document.getElementById('client-date').value;
        const desc = document.getElementById('issue-desc').value.trim();

        // 🔐 الباب السري → dashboard.html
        if (name === '0667089344' && car === '0790582551') {
            showToast('🔓 تم التعرف على المفتاح الرئيسي، جاري فتح لوحة الإدارة...');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 800);
            return;
        }

        if (!name) {
            showToast(currentLang === 'ar' ? '⚠️ يرجى إدخال الاسم' : '⚠️ Veuillez entrer votre nom', 'error');
            document.getElementById('client-name').focus();
            return;
        }

        // جمع الخدمات المختارة
        const services = [];
        document.querySelectorAll('input[name="bookingService"]:checked').forEach(cb => {
            services.push(cb.value);
        });

        // 💾 حفظ الحجز في mg_bookings
        const booking = {
            id: Date.now(),
            name: name,
            car: car,
            phone: phone,
            date: bDate,
            services: services,
            desc: desc,
            status: 'pending',
            createdAt: Date.now()
        };

        try {
            let bookings = [];
            try {
                bookings = JSON.parse(localStorage.getItem('mg_bookings') || '[]');
            } catch(e) { bookings = []; }
            bookings.unshift(booking);
            localStorage.setItem('mg_bookings', JSON.stringify(bookings));
        } catch(e) {
            showToast('⚠️ خطأ في حفظ الحجز', 'error');
        }

        // منع الإرسال المزدوج
        const btn = document.getElementById('submitBookingBtn');
        btn.disabled = true;

        // بناء رسالة واتساب
        let text = currentLang === 'ar' ? "السلام عليكم، أريد حجز موعد:\n\n" : "Bonjour, je souhaite prendre rendez-vous :\n\n";
        text += "👤 الاسم: " + name + "\n";
        if (car) text += "🚘 السيارة: " + car + "\n";
        if (phone) text += "📞 الهاتف: " + phone + "\n";
        if (bDate) text += "📅 الموعد المرغوب: " + bDate + "\n";
        if (services.length > 0) text += "🛠️ الخدمات: " + services.join(' + ') + "\n";
        if (desc) text += "📝 المشكل: " + desc;

        const whatsappUrl = "https://wa.me/213790582551?text=" + encodeURIComponent(text);
        window.open(whatsappUrl, '_blank');
        showToast(currentLang === 'ar' ? '✅ تم حفظ الحجز + جاري فتح واتساب...' : '✅ Réservation enregistrée + ouverture de WhatsApp...');

        // إعادة تمكين الزر بعد 3 ثوان
        setTimeout(() => { btn.disabled = false; }, 3000);
    }

    // ============ حد أدنى للتاريخ = اليوم ============
    window.addEventListener('DOMContentLoaded', () => {
        const dateInput = document.getElementById('client-date');
        if (dateInput) {
            const today = new Date().toISOString().split('T')[0];
            dateInput.min = today;
        }
    });
</script>

<!-- ============ تسجيل Service Worker ============ -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
            .then(reg => console.log('✅ Service Worker registered:', reg.scope))
            .catch(err => console.log('❌ Service Worker error:', err));
    });
}
</script>

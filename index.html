<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MED-GARAGE - تسجيل الخدمات والسيارات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #d32f2f;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #d32f2f;
            outline: none;
        }
        .checkbox-group {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 12px;
            border-radius: 6px;
            max-height: 150px;
            overflow-y: auto;
        }
        .checkbox-item {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .parts-container {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            background: #fafafa;
            margin-bottom: 10px;
        }
        .part-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        button {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #b71c1c;
        }
        .btn-secondary {
            background-color: #555;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background-color: #333;
        }
        .nav-admin {
            text-align: center;
            margin-top: 20px;
        }
        .nav-admin a {
            color: #d32f2f;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ MED-GARAGE - تسجيل مركبة</h1>
        
        <form id="garageForm">
            <!-- معلومات الزبون والسيارة -->
            <div class="form-group">
                <label>اسم الزبون:</label>
                <input type="text" id="clientName" required placeholder="أدخل اسم الزبون الكريم">
            </div>

            <div class="form-group">
                <label>رقم تسجبل السيارة (Matricule / نوع السيارة):</label>
                <input type="text" id="carInfo" required placeholder="مثال: سكودا أوكتافيا - 2025">
            </div>

            <!-- الخدمات (اختيار عدة خدمات بـ Checkboxes) -->
            <div class="form-group">
                <label>الخدمات المطلوبة (يمكن اختيار أكثر من خدمة):</label>
                <div class="checkbox-group" id="servicesCheckboxGroup">
                    <!-- تتعبى أوماتيكياً من السطوك أو الخدمات المعرفة -->
                    <label><input type="checkbox" name="service" value="vidange"> تبديل زيت وفلتر</label>
                    <label><input type="checkbox" name="service" value="brakes"> تغيير بلاكيت فرامل</label>
                    <label><input type="checkbox" name="service" value="diagnostic"> كشف بالديغنوستيك (Scanner)</label>
                    <label><input type="checkbox" name="service" value="suspension"> إصلاح العليق (Suspension)</label>
                </div>
            </div>

            <!-- القطع المستعملة (من السطوك أو قطع حرة) -->
            <div class="form-group">
                <label>القطع المستعملة (من السطوك أو خارجية):</label>
                <div id="selectedPartsList" class="parts-container">
                    <!-- صف أول افتراضي لإضافة قطعة -->
                    <div class="part-row">
                        <select class="part-select">
                            <option value="">اختر قطعة من السطوك...</option>
                            <!-- تتعبى من المخزون -->
                        </select>
                        <input type="number" class="part-qty" min="1" value="1" placeholder="الكمية" style="width: 90px;">
                        <button type="button" onclick="this.parentElement.remove()" style="width: auto; background: #c62828; padding: 8px 12px;">حذف</button>
                    </div>
                </div>
                <button type="button" class="btn-secondary" onclick="addPartRow()">+ إضافة قطعة أخرى من السطوك</button>
                <button type="button" class="btn-secondary" onclick="addCustomPartRow()" style="background: #2e7d32;">+ إضافة قطعة حرة (خارج السطوك)</button>
            </div>

            <button type="submit">حفظ وتسجيل البيانات</button>
        </form>

        <div class="nav-admin">
            <a href="admin.html">⚙️ الانتقال إلى لوحة الإدارة والفوترة</a>
        </div>
    </div>

    <script>
        // تحميل القطع المخزنة في السطوك لمحاكاة القائمة المنسدلة
        function loadStockOptions() {
            let stock = JSON.parse(localStorage.getItem('med_garage_stock')) || [
                {id: 1, name: 'فلتر زيت 1.4 TSI', qty: 10, buyPrice: 1200, sellPrice: 2000},
                {id: 2, name: 'بوجيات (Bougies)', qty: 16, buyPrice: 800, sellPrice: 1500},
                {id: 3, name: 'بيدون زيت 5W40', qty: 5, buyPrice: 6500, sellPrice: 8500}
            ];
            
            // تخزين افتراضي إذا كان فارغاً
            if(!localStorage.getItem('med_garage_stock')) {
                localStorage.setItem('med_garage_stock', JSON.stringify(stock));
            }

            // تعبئة الـ Selects
            document.querySelectorAll('.part-select').forEach(select => {
                select.innerHTML = '<option value="">اختر قطعة من السطوك...</option>';
                stock.forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.name;
                    opt.textContent = `${item.name} (متوفر: ${item.qty}) - السعر: ${item.sellPrice} دج`;
                    select.appendChild(opt);
                });
            });
        }

        function addPartRow() {
            let container = document.getElementById('selectedPartsList');
            let div = document.createElement('div');
            div.className = 'part-row';
            div.innerHTML = `
                <select class="part-select">
                    <option value="">اختر قطعة من السطوك...</option>
                </select>
                <input type="number" class="part-qty" min="1" value="1" placeholder="الكمية" style="width: 90px;">
                <button type="button" onclick="this.parentElement.remove()" style="width: auto; background: #c62828; padding: 8px 12px;">حذف</button>
            `;
            container.appendChild(div);
            loadStockOptions();
        }

        function addCustomPartRow() {
            let container = document.getElementById('selectedPartsList');
            let div = document.createElement('div');
            div.className = 'part-row';
            div.innerHTML = `
                <input type="text" class="custom-part-name" placeholder="اسم القطعة الحرة (مثال: جابها الزبون)" style="flex: 2;">
                <input type="number" class="custom-part-price" placeholder="السعر" style="width: 100px;">
                <input type="number" class="custom-part-qty" min="1" value="1" placeholder="الكمية" style="width: 70px;">
                <button type="button" onclick="this.parentElement.remove()" style="width: auto; background: #c62828; padding: 8px 12px;">حذف</button>
            `;
            container.appendChild(div);
        }

        // تشغيل تعبئة السطوك عند فتح الصفحة
        window.onload = function() {
            loadStockOptions();
        };

        // حفظ البيانات في الـ LocalStorage
        document.getElementById('garageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let clientName = document.getElementById('clientName').value;
            let carInfo = document.getElementById('carInfo').value;
            
            // جمع الخدمات المختارة
            let selectedServices = [];
            document.querySelectorAll('input[name="service"]:checked').forEach(cb => {
                selectedServices.push(cb.value);
            });

            // جمع القطع (السطوك + الحرة)
            let partsUsed = [];
            document.querySelectorAll('.part-row').forEach(row => {
                let select = row.querySelector('.part-select');
                let qtyInput = row.querySelector('.part-qty');
                let customName = row.querySelector('.custom-part-name');
                let customPrice = row.querySelector('.custom-part-price');
                let customQty = row.querySelector('.custom-part-qty');

                if(select && select.value) {
                    partsUsed.push({ type: 'stock', name: select.value, qty: parseInt(qtyInput.value) || 1 });
                } else if(customName && customName.value) {
                    partsUsed.push({ type: 'custom', name: customName.value, price: parseFloat(customPrice.value) || 0, qty: parseInt(customQty.value) || 1 });
                }
            });

            let jobRecord = {
                id: Date.now(),
                clientName,
                carInfo,
                services: selectedServices,
                parts: partsUsed,
                date: new Date().toLocaleDateString('ar-DZ')
            };

            let jobs = JSON.parse(localStorage.getItem('med_garage_jobs')) || [];
            jobs.push(jobRecord);
            localStorage.setItem('med_garage_jobs', JSON.stringify(jobs));

            alert('تم تسجيل البيانات بنجاح يا معلم!');
            this.reset();
            loadStockOptions();
        });
    </script>
</body>
</html>

<!-- ================= لوحة تحكم المدير السرية (خاصة بك وحدك) ================= -->
<div id="adminPanel" style="display:none; margin-top: 30px; background: #181b20; border: 2px dashed var(--accent); border-radius: 12px; padding: 18px; color: #fff;">
    <h3 style="color: var(--accent); text-align: center; margin-top: 0;">🔐 لوحة تحكم المدير (خاصة بـ محمد)</h3>
    
    <!-- إحصائيات سريعة -->
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px;">
        <div style="background: rgba(22, 163, 74, 0.2); border: 1px solid var(--success); padding: 10px; border-radius: 8px; text-align: center;">
            <div style="font-size: 12px; color: #86efac;">المداخيل اليومية</div>
            <div id="totalIncome" style="font-size: 18px; font-weight: bold; color: #4ade80;">0 دج</div>
        </div>
        <div style="background: rgba(220, 38, 38, 0.2); border: 1px solid var(--primary); padding: 10px; border-radius: 8px; text-align: center;">
            <div style="font-size: 12px; color: #fca5a5;">المصاريف</div>
            <div id="totalExpenses" style="font-size: 18px; font-weight: bold; color: #f87171;">0 دج</div>
        </div>
    </div>

    <!-- نموذج تسجيل عملية (دخل أو خرج) -->
    <div class="form-group">
        <label>نوع العملية:</label>
        <select id="trxType" class="form-control">
            <option value="income">💰 مدخول (خدمة / بيع قطعة)</option>
            <option value="expense"> خرج (شراء عتاد / مصاريف)</option>
        </select>
    </div>
    <div class="form-group">
        <label>وصف العملية (مثلا: فيدانغ كولف 7 / شراء زيت):</label>
        <input type="text" id="trxDesc" class="form-control" placeholder="اكتب التفاصيل...">
    </div>
    <div class="form-group">
        <label>المبلغ بـ DZD:</label>
        <input type="number" id="trxAmount" class="form-control" placeholder="0000">
    </div>
    <button type="button" onclick="saveTransaction()" class="btn-submit-booking" style="background: var(--success);">💾 تسجيل في هاتفك</button>

    <!-- قائمة العمليات الأخيرة -->
    <h4 style="margin-top: 20px; font-size: 14px; color: #cbd5e1;">📋 العمليات المسجلة محلياً:</h4>
    <div id="trxList" style="max-height: 150px; overflow-y: auto; font-size: 12px; background: #0f1115; padding: 8px; border-radius: 6px;">
        <div style="color: #64748b; text-align: center;">لا توجد عمليات مسجلة بعد</div>
    </div>
    
    <button type="button" onclick="toggleAdmin()" style="background: transparent; border: 1px solid #64748b; color: #94a3b8; width: 100%; margin-top: 15px; padding: 8px; border-radius: 6px; cursor: pointer;">إغلاق لوحة التحكم 🔒</button>
</div>

<!-- زر سري صغير في Footer فتح لوحة التحكم -->
<div style="text-align: center; margin-top: 10px;">
    <button onclick="toggleAdmin()" style="background: none; border: none; color: #64748b; font-size: 11px; cursor: pointer; text-decoration: underline;">تسجيل الدخول للإدارة 🔑</button>
</div>

<script>
// ==================== سكريبت الإدارة المحلية السرية ====================
function toggleAdmin() {
    const panel = document.getElementById('adminPanel');
    if (panel.style.display === 'none') {
        const pin = prompt('أدخل رمز المرور السري الخاص بك:');
        if (pin === '1992') { // تقدر تبدل الكود كيما تحب (مثلا تاريخ ميلادك أو رقم سري خاص)
            panel.style.display = 'block';
            loadTransactions();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        } else if (pin !== null) {
            alert('رمز المرور خاطئ!');
        }
    } else {
        panel.style.display = 'none';
    }
}

function saveTransaction() {
    const type = document.getElementById('trxType').value;
    const desc = document.getElementById('trxDesc').value.trim();
    const amount = parseFloat(document.getElementById('trxAmount').value);

    if (!desc || isNaN(amount) || amount <= 0) {
        alert('يرجى إدخال وصف صحيح ومبلغ مالي صالح!');
        return;
    }

    let transactions = JSON.parse(localStorage.getItem('medgarage_trx') || '[]');
    transactions.unshift({
        id: Date.now(),
        type: type,
        desc: desc,
        amount: amount,
        date: new Date().toLocaleDateString('ar-DZ')
    });

    localStorage.setItem('medgarage_trx', JSON.stringify(transactions));
    
    document.getElementById('trxDesc').value = '';
    document.getElementById('trxAmount').value = '';
    
    loadTransactions();
    showToast('✅ تم تسجيل العملية في هاتفك بسرية تامة');
}

function loadTransactions() {
    let transactions = JSON.parse(localStorage.getItem('medgarage_trx') || '[]');
    const listEl = document.getElementById('trxList');
    const incomeEl = document.getElementById('totalIncome');
    const expenseEl = document.getElementById('totalExpenses');

    let totalInc = 0;
    let totalExp = 0;

    if (transactions.length === 0) {
        listEl.innerHTML = '<div style="color: #64748b; text-align: center;">لا توجد عمليات مسجلة بعد</div>';
        incomeEl.textContent = '0 دج';
        expenseEl.textContent = '0 دج';
        return;
    }

    let html = '';
    transactions.forEach(t => {
        if (t.type === 'income') totalInc += t.amount;
        else totalExp += t.amount;

        html += `<div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #222;">
            <span>${t.type === 'income' ? '🟢' : '🔴'} ${t.desc} (${t.date})</span>
            <span style="font-weight: bold; color: ${t.type === 'income' ? '#4ade80' : '#f87171'};">${t.amount} دج</span>
        </div>`;
    });

    listEl.innerHTML = html;
    incomeEl.textContent = totalInc.toLocaleString() + ' دج';
    expenseEl.textContent = totalExp.toLocaleString() + ' دج';
}
</script>

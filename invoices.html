<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MED GARAGE - الفوترة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #dc2626;
            --bg: #1f242b;
            --card-dark: #2a2f36;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --success: #16a34a;
            --info: #2563eb;
            --border-dark: #374151;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', system-ui, sans-serif; font-weight: 700; background: #181b20; color: var(--text-light); margin: 0; padding: 15px; line-height: 1.6; min-height: 100vh; }
        .container { max-width: 550px; margin: 0 auto; padding-bottom: 40px; }

        .admin-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: var(--card-dark); border-radius: 12px; border: 1px solid var(--border-dark); margin-bottom: 20px; }
        .admin-header h2 { margin: 0; font-size: 16px; color: #fff; }
        .btn-back-admin { background: transparent; border: 1px solid var(--border-dark); color: var(--text-muted); padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
        .btn-back-admin:hover { color: var(--text-light); }

        .section-title { font-size: 16px; margin: 22px 0 12px; color: var(--text-light); border-right: 4px solid var(--primary); padding-right: 10px; font-weight: 900; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; font-weight: 700; }
        .form-control { width: 100%; padding: 11px; background: #0f1115; border: 1px solid var(--border-dark); border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit; font-weight: 700; box-sizing: border-box; }
        .form-control:focus { outline: none; border-color: var(--primary); }
        .form-control.phone-input { direction: ltr; text-align: right; unicode-bidi: embed; }

        .btn-submit-booking { background-color: var(--primary); color: #fff; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 900; font-size: 14px; cursor: pointer; font-family: inherit; box-shadow: 0 4px 10px rgba(220,38,38,0.3); }

        .btn { border: none; padding: 10px 18px; border-radius: 6px; font-weight: 900; cursor: pointer; font-family: inherit; color: #fff; }
        .btn-sm { padding: 6px 10px; font-size: 11px; }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--accent); }
        .btn-info { background: var(--info); }
        .btn-danger { background: var(--primary); }

        .list-box { background: #181b20; border: 1px solid var(--border-dark); border-radius: 10px; padding: 10px; max-height: 500px; overflow-y: auto; margin-top: 10px; }
        .list-row { background: #0f1115; padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; border: 1px solid var(--border-dark); color: #f1f5f9; }
        .empty-state { text-align: center; padding: 25px 15px; color: var(--text-muted); font-size: 12px; }

        .footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); font-size: 12px; }
        .footer strong { color: var(--primary); }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--success); color: #fff; padding: 12px 20px; border-radius: 8px; font-weight: 900; font-size: 14px; z-index: 9999; transition: transform 0.3s ease; max-width: 90%; text-align: center; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--primary); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 15px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-dark); border: 2px solid var(--primary); border-radius: 15px; padding: 20px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; color: #fff; }
        .modal-content h3 { margin-top: 0; color: var(--accent); text-align: center; }

        .items-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .items-table th, .items-table td { padding: 6px 4px; text-align: center; font-size: 12px; border-bottom: 1px solid var(--border-dark); color: #fff; }
        .items-table th { background: rgba(255,255,255,0.05); color: var(--accent); font-weight: 900; }
        .items-table input, .items-table select { width: 100%; padding: 6px; font-size: 12px; background: #0f1115; color: #fff; border: 1px solid var(--border-dark); border-radius: 4px; font-family: inherit; text-align: center; }
        .items-table .col-type { width: 20%; }
        .items-table .col-name { width: 40%; }
        .items-table .col-qty { width: 12%; }
        .items-table .col-price { width: 18%; }
        .items-table .col-del { width: 10%; }

        .add-item-btn { border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: 900; cursor: pointer; font-family: inherit; color: #fff; }
        .add-item-btn:hover { opacity: 0.9; }

        .total-box { background: rgba(22,163,74,0.15); border: 1px solid var(--success); border-radius: 8px; padding: 12px; margin-top: 12px; text-align: center; }
        .total-box .lbl { font-size: 12px; color: #94a3b8; }
        .total-box .val { font-size: 22px; font-weight: 900; color: #4ade80; }

        .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; padding: 8px 0; }
        .checkbox-group label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #fff; cursor: pointer; }
        .checkbox-group input[type="checkbox"], .checkbox-group input[type="radio"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

        #pdfPreviewModal.modal-overlay { padding: 0; align-items: stretch; justify-content: stretch; }
        #pdfPreviewModal .modal-content { max-width: 100% !important; width: 100%; height: 100vh; height: 100dvh; max-height: 100vh; max-height: 100dvh; border-radius: 0; border: none; padding: 0; display: flex; flex-direction: column; background: #1e293b; overflow: hidden; }
        #pdfPreviewModal .pdf-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #0f172a; border-bottom: 2px solid var(--primary); gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
        #pdfPreviewModal .pdf-toolbar h3 { margin: 0; color: var(--accent); font-size: 15px; }
        #pdfPreviewModal .pdf-toolbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        #pdfPreviewModal .pdf-body { flex: 1; overflow: auto; padding: 15px; background: #334155; display: flex; justify-content: center; align-items: flex-start; }
        #pdfPreviewContent { background: #fff; color: #000; width: 100%; max-width: 794px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); padding: 20px; border-radius: 4px; }
        #pdfPreviewModal .pdf-footer { display: flex; gap: 8px; padding: 10px 14px; background: #0f172a; border-top: 2px solid var(--primary); flex-wrap: wrap; flex-shrink: 0; }
        #pdfPreviewModal .pdf-footer button { flex: 1; min-width: 120px; }

        @media (max-width: 600px) {
            #pdfPreviewContent { padding: 10px; }
            #pdfPreviewModal .pdf-footer button { font-size: 12px; padding: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="admin-header">
        <h2>🧾 الفوترة والدوفي</h2>
        <a href="./dashboard.html" class="btn-back-admin">← رجوع</a>
    </div>

    <button onclick="openNewInvoice()" class="btn-submit-booking" style="background:var(--success); margin-bottom:20px;">
        ➕ إنشاء فاتورة أو Devis جديد
    </button>

    <div class="section-title">📄 عروض الأسعار (Devis)</div>
    <div class="list-box" id="devisList">
        <div class="empty-state">لا توجد عروض أسعار حالياً</div>
    </div>

    <div class="section-title">✅ الفواتير المكتملة</div>
    <div class="list-box" id="doneList">
        <div class="empty-state">لا توجد فواتير مكتملة</div>
    </div>

    <div class="footer">
        <strong>MED GARAGE</strong> © 2027 — الفوترة
    </div>
</div>

<!-- MODAL: إنشاء فاتورة -->
<div class="modal-overlay" id="invoiceModal">
    <div class="modal-content">
        <h3 id="modalTitle">🧾 فاتورة جديدة</h3>

        <div class="form-group">
            <label>رقم الفاتورة</label>
            <input type="text" id="invCode" class="form-control" readonly style="color:var(--accent); font-weight:900; direction:ltr; text-align:center;">
        </div>
        <div class="form-group">
            <label>اسم الزبون *</label>
            <input type="text" id="invClient" class="form-control" placeholder="أدخل اسم الزبون">
        </div>
        <div class="form-group">
            <label>الهاتف</label>
            <input type="tel" id="invPhone" class="form-control phone-input" placeholder="05 XX XX XX XX" maxlength="10" inputmode="numeric">
        </div>
        <div class="form-group">
            <label>السيارة</label>
            <input type="text" id="invCar" class="form-control" placeholder="Ex: Skoda Octavia">
        </div>
        <div class="form-group">
            <label>VIN (رقم الهيكل)</label>
            <input type="text" id="invVin" class="form-control" placeholder="17 حرف/رقم" maxlength="17" style="direction:ltr; text-align:center; text-transform:uppercase;">
        </div>
        <div class="form-group">
            <label>لوحة السيارة</label>
            <input type="text" id="invPlate" class="form-control" placeholder="16 117 12345" style="direction:ltr; text-align:center;">
        </div>
        <div class="form-group">
            <label>KM (الكيلومترات)</label>
            <input type="number" id="invKm" class="form-control" placeholder="اختياري" min="0" style="text-align:center;">
        </div>
        <div class="form-group">
            <label>ملاحظات / طلب الزبون</label>
            <textarea id="invNotes" class="form-control" placeholder="اختياري" rows="2"></textarea>
        </div>

        <!-- ⚡ جدول القطع والخدمات (الجديد) -->
        <div class="form-group">
            <label>القطع والخدمات</label>
            <table class="items-table">
                <thead>
                    <tr>
                        <th class="col-type">النوع</th>
                        <th class="col-name">البيان</th>
                        <th class="col-qty">الكمية</th>
                        <th class="col-price">السعر</th>
                        <th class="col-del"></th>
                    </tr>
                </thead>
                <tbody id="itemsBody"></tbody>
            </table>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <button type="button" onclick="addItemRow('piece_stock')" class="add-item-btn" style="background:var(--success);">➕ قطعة من المخزن</button>
                <button type="button" onclick="addItemRow('piece_external')" class="add-item-btn" style="background:var(--accent);">➕ قطعة خارجية</button>
                <button type="button" onclick="addItemRow('labor')" class="add-item-btn" style="background:var(--info);">➕ إضافة خدمة (يد عاملة)</button>
            </div>
        </div>

        <div class="form-group">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                <input type="checkbox" id="invTvaEnabled" onchange="calcTotal()" style="width:18px; height:18px; accent-color:var(--success);">
                <span>تفعيل TVA (19%)</span>
            </label>
        </div>

        <div class="total-box">
            <div class="lbl">المجموع الفرعي (HT)</div>
            <div class="val" id="invSubtotal">0 دج</div>
            <div class="lbl" id="tvaLine" style="margin-top:8px; display:none;">TVA (19%): <span id="invTva">0 دج</span></div>
            <div class="lbl" style="margin-top:8px; font-size:14px;">المجموع الإجمالي (TTC)</div>
            <div class="val" id="invTotal" style="font-size:24px;">0 دج</div>
        </div>

        <div class="form-group" style="margin-top:12px;">
            <label>طريقة الدفع</label>
            <div class="checkbox-group">
                <label><input type="radio" name="paymentMethod" value="Espèces" checked> 💵 نقداً</label>
                <label><input type="radio" name="paymentMethod" value="Chèque"> 📝 شيك</label>
                <label><input type="radio" name="paymentMethod" value="Virement"> 🏦 تحويل</label>
            </div>
        </div>
        <div class="form-group">
            <label>حالة الفاتورة</label>
            <div class="checkbox-group">
                <label><input type="radio" name="paymentStatus" value="Payée" checked> ✅ مدفوعة</label>
                <label><input type="radio" name="paymentStatus" value="Partiel"> ⏳ جزئية</label>
                <label><input type="radio" name="paymentStatus" value="Non payée"> ❌ غير مدفوعة</label>
            </div>
        </div>
        <div class="form-group">
            <label>نوع المستند</label>
            <select id="invStatus" class="form-control">
                <option value="done">✅ فاتورة مكتملة</option>
                <option value="devis">📄 Devis (عرض سعر)</option>
            </select>
        </div>

        <button onclick="saveInvoice()" class="btn-submit-booking" style="background:var(--success); margin-top:10px;">💾 حفظ الفاتورة</button>
        <button onclick="closeInvoiceModal()" class="btn-back-admin" style="width:100%; text-align:center; margin-top:8px;">إلغاء</button>
    </div>
</div>

<!-- MODAL: معاينة PDF -->
<div class="modal-overlay" id="pdfPreviewModal">
    <div class="modal-content">
        <div class="pdf-toolbar">
            <h3>📄 معاينة الفاتورة</h3>
            <div class="pdf-toolbar-actions">
                <button onclick="closePdfPreview()" style="background:transparent; border:none; color:#fff; font-size:24px; cursor:pointer; padding:0 8px;">✕</button>
            </div>
        </div>
        <div class="pdf-body">
            <div id="pdfPreviewContent"></div>
        </div>
        <div class="pdf-footer">
            <button onclick="downloadPDF()" class="btn-submit-booking" style="background:var(--info);">📥 تحميل PDF</button>
            <button onclick="printPDF()" class="btn-submit-booking" style="background:var(--success);">🖨️ طباعة</button>
            <button onclick="closePdfPreview()" class="btn-back-admin">إلغاء</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // ==========================================
    // 1. إدارة البيانات (localStorage)
    // ==========================================
    let invoices = JSON.parse(localStorage.getItem('med_garage_invoices') || '[]');
    let currentInvoiceId = null;

    function saveToStorage() {
        localStorage.setItem('med_garage_invoices', JSON.stringify(invoices));
    }

    function generateInvoiceCode() {
        const now = new Date();
        const year = now.getFullYear().toString().slice(-2);
        const month = (now.getMonth() + 1).toString().padStart(2, '0');
        const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
        return `M-G ${year}${month}${random}`;
    }

    // ==========================================
    // 2. عرض القوائم
    // ==========================================
    function renderLists() {
        const devisList = document.getElementById('devisList');
        const doneList = document.getElementById('doneList');
        const devis = invoices.filter(i => i.status === 'devis');
        const done = invoices.filter(i => i.status === 'done');

        devisList.innerHTML = devis.length ? '' : '<div class="empty-state">لا توجد عروض أسعار حالياً</div>';
        devis.forEach(inv => {
            devisList.innerHTML += `
                <div class="list-row">
                    <strong>${inv.code}</strong> — ${inv.client}<br>
                    <span style="color:var(--accent);">${inv.total.toFixed(2)} دج</span>
                </div>
            `;
        });

        doneList.innerHTML = done.length ? '' : '<div class="empty-state">لا توجد فواتير مكتملة</div>';
        done.forEach(inv => {
            doneList.innerHTML += `
                <div class="list-row">
                    <strong>${inv.code}</strong> — ${inv.client}<br>
                    <span style="color:var(--success);">${inv.total.toFixed(2)} دج</span>
                </div>
            `;
        });
    }

    // ==========================================
    // 3. فتح/إغلاق المودال
    // ==========================================
    function openNewInvoice() {
        currentInvoiceId = null;
        document.getElementById('modalTitle').textContent = '🧾 فاتورة جديدة';
        document.getElementById('invCode').value = generateInvoiceCode();
        document.getElementById('invClient').value = '';
        document.getElementById('invPhone').value = '';
        document.getElementById('invCar').value = '';
        document.getElementById('invVin').value = '';
        document.getElementById('invPlate').value = '';
        document.getElementById('invKm').value = '';
        document.getElementById('invNotes').value = '';
        document.getElementById('invTvaEnabled').checked = false;
        document.getElementById('itemsBody').innerHTML = '';
        document.getElementById('invStatus').value = 'done';
        document.getElementById('invoiceModal').classList.add('active');
        calcTotal();
    }

    function closeInvoiceModal() {
        document.getElementById('invoiceModal').classList.remove('active');
    }

    // ==========================================
    // 4. إدارة جدول القطع والخدمات
    // ==========================================
    function addItemRow(type = 'piece_stock') {
        const tbody = document.getElementById('itemsBody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="col-type">
                <select class="item-type" onchange="calcTotal()">
                    <option value="piece_stock" ${type === 'piece_stock' ? 'selected' : ''}>من المخزن</option>
                    <option value="piece_external" ${type === 'piece_external' ? 'selected' : ''}>قطعة خارجية</option>
                    <option value="labor" ${type === 'labor' ? 'selected' : ''}>يد عاملة</option>
                </select>
            </td>
            <td class="col-name"><input type="text" class="item-name" placeholder="اسم القطعة/الخدمة" oninput="calcTotal()"></td>
            <td class="col-qty"><input type="number" class="item-qty" value="1" min="1" oninput="calcTotal()"></td>
            <td class="col-price"><input type="number" class="item-price" value="0" min="0" oninput="calcTotal()"></td>
            <td class="col-del"><button type="button" onclick="this.closest('tr').remove(); calcTotal();" style="background:var(--primary); color:#fff; border:none; border-radius:4px; padding:4px 8px; cursor:pointer;">✕</button></td>
        `;
        tbody.appendChild(row);
        calcTotal();
    }

    // ==========================================
    // 5. حساب المجاميع
    // ==========================================
    function calcTotal() {
        let subtotal = 0;
        document.querySelectorAll('#itemsBody tr').forEach(row => {
            const qty = parseFloat(row.querySelector('.item-qty')?.value) || 0;
            const price = parseFloat(row.querySelector('.item-price')?.value) || 0;
            subtotal += qty * price;
        });

        const tvaEnabled = document.getElementById('invTvaEnabled').checked;
        const tva = tvaEnabled ? subtotal * 0.19 : 0;
        const total = subtotal + tva;

        document.getElementById('invSubtotal').textContent = subtotal.toFixed(2) + ' دج';
        document.getElementById('invTva').textContent = tva.toFixed(2) + ' دج';
        document.getElementById('invTotal').textContent = total.toFixed(2) + ' دج';
        document.getElementById('tvaLine').style.display = tvaEnabled ? 'block' : 'none';
    }

    // ==========================================
    // 6. حفظ الفاتورة
    // ==========================================
    function saveInvoice() {
        const client = document.getElementById('invClient').value.trim();
        if (!client) {
            showToast('❌ الرجاء إدخال اسم الزبون', true);
            return;
        }

        const items = [];
        document.querySelectorAll('#itemsBody tr').forEach(row => {
            items.push({
                type: row.querySelector('.item-type').value,
                name: row.querySelector('.item-name').value.trim(),
                qty: parseFloat(row.querySelector('.item-qty').value) || 0,
                price: parseFloat(row.querySelector('.item-price').value) || 0,
            });
        });

        const subtotal = items.reduce((s, i) => s + i.qty * i.price, 0);
        const tvaEnabled = document.getElementById('invTvaEnabled').checked;
        const tva = tvaEnabled ? subtotal * 0.19 : 0;
        const total = subtotal + tva;

        const invoice = {
            id: Date.now(),
            code: document.getElementById('invCode').value,
            client: client,
            phone: document.getElementById('invPhone').value,
            car: document.getElementById('invCar').value,
            vin: document.getElementById('invVin').value,
            plate: document.getElementById('invPlate').value,
            km: document.getElementById('invKm').value,
            notes: document.getElementById('invNotes').value,
            items: items,
            subtotal: subtotal,
            tvaEnabled: tvaEnabled,
            tva: tva,
            total: total,
            paymentMethod: document.querySelector('input[name="paymentMethod"]:checked').value,
            paymentStatus: document.querySelector('input[name="paymentStatus"]:checked').value,
            status: document.getElementById('invStatus').value,
            date: new Date().toLocaleString('fr-FR'),
        };

        invoices.push(invoice);
        saveToStorage();
        renderLists();
        closeInvoiceModal();
        showToast('✅ تم حفظ الفاتورة بنجاح');
    }

    // ==========================================
    // 7. معاينة PDF (مبسطة)
    // ==========================================
    function previewPDF(invoiceId) {
        const inv = invoices.find(i => i.id === invoiceId);
        if (!inv) return;
        const content = document.getElementById('pdfPreviewContent');
        content.innerHTML = `
            <div style="font-family:Cairo; direction:rtl; padding:20px;">
                <h2 style="color:#dc2626; text-align:center;">MED GARAGE</h2>
                <p style="text-align:center; font-size:12px;">الجزائر العاصمة — 0790 58 25 51</p>
                <hr>
                <h3 style="text-align:center;">${inv.code}</h3>
                <p><strong>الزبون:</strong> ${inv.client}</p>
                <p><strong>الهاتف:</strong> ${inv.phone}</p>
                <p><strong>السيارة:</strong> ${inv.car} — ${inv.plate}</p>
                <table style="width:100%; border-collapse:collapse; margin-top:15px;">
                    <thead><tr style="background:#f3f4f6;"><th>النوع</th><th>البيان</th><th>الكمية</th><th>السعر</th></tr></thead>
                    <tbody>
                        ${inv.items.map(i => `<tr><td>${i.type}</td><td>${i.name}</td><td>${i.qty}</td><td>${i.price} دج</td></tr>`).join('')}
                    </tbody>
                </table>
                <hr>
                <p style="text-align:left;"><strong>Total HT:</strong> ${inv.subtotal.toFixed(2)} دج</p>
                ${inv.tvaEnabled ? `<p style="text-align:left;"><strong>TVA (19%):</strong> ${inv.tva.toFixed(2)} دج</p>` : ''}
                <p style="text-align:left; font-size:18px; color:#16a34a;"><strong>Total TTC:</strong> ${inv.total.toFixed(2)} دج</p>
                <p style="text-align:center; font-size:11px; color:#666; margin-top:20px;">شكراً لثقتكم — MED GARAGE</p>
            </div>
        `;
        document.getElementById('pdfPreviewModal').classList.add('active');
    }

    function closePdfPreview() {
        document.getElementById('pdfPreviewModal').classList.remove('active');
    }

    function downloadPDF() {
        // هنا تقدر تستعمل مكتبة html2pdf.js ولا jsPDF
        alert('مكتبة PDF خاصها تكون مثبتة. هاد الزر راهو تجريبي.');
    }

    function printPDF() {
        window.print();
    }

    // ==========================================
    // 8. Toast
    // ==========================================
    function showToast(msg, isError = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isError ? ' error' : '');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ==========================================
    // 9. التهيئة
    // ==========================================
    renderLists();
</script>

</body>
